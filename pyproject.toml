[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soutine-seedance-prompts"
version = "0.1.0"
description = "Reference package for Soutine's free Seedance video prompt library with clip previews."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "leony", email = "leony2919@gmail.com" }]
keywords = ["seedance", "prompt-library", "soutine", "ai-video", "text-to-video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
[project.urls]
Homepage = "https://soutine.ai/seedance-prompts"
Documentation = "https://soutine.ai/seedance-prompts"
Source = "https://github.com/wayperlee/soutine-seedance-prompts"
"Prompt Library" = "https://soutine.ai/seedance-prompts"

[tool.setuptools.packages.find]
where = ["src"]
